# ═══════════════════════════════════════════════════════════════════════════════
# 🏛️ QANTUM MIND ENGINE - DEFAULT SERVER CONFIGURATION
# Main API Gateway server block
# ═══════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect to HTTPS in production (uncomment when SSL is configured)
    # return 301 https://$server_name$request_uri;

    # ═══════════════════════════════════════════════════════════════════════════
    # Health Check Endpoints
    # ═══════════════════════════════════════════════════════════════════════════
    
    location /healthz {
        access_log off;
        return 200 'healthy';
        add_header Content-Type text/plain;
    }

    location /readyz {
        access_log off;
        proxy_pass http://qantum_core/api/status;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # Main API Routes - QAntum Core (Node.js)
    # ═══════════════════════════════════════════════════════════════════════════
    
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 100;

        proxy_pass http://qantum_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # WebSocket Support
    # ═══════════════════════════════════════════════════════════════════════════
    
    location /ws {
        proxy_pass http://qantum_core;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # Aeterna Node Routes (Rust)
    # ═══════════════════════════════════════════════════════════════════════════
    
    location /aeterna/ {
        limit_req zone=api_limit burst=30 nodelay;
        
        rewrite ^/aeterna/(.*)$ /$1 break;
        proxy_pass http://aeterna_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Direct Aeterna endpoints
    location ~ ^/(telemetry|nervous-system|command|manifesto|reality-integrity|ontology|entropy)$ {
        proxy_pass http://aeterna_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # Authentication Routes (Rate Limited)
    # ═══════════════════════════════════════════════════════════════════════════
    
    location /auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        
        proxy_pass http://qantum_core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # Monitoring Endpoints (Internal Only)
    # ═══════════════════════════════════════════════════════════════════════════
    
    location /metrics {
        # In production, restrict to internal networks
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # allow 192.168.0.0/16;
        # deny all;
        
        proxy_pass http://qantum_core/api/metrics;
        proxy_http_version 1.1;
    }

    location /grafana/ {
        rewrite ^/grafana/(.*)$ /$1 break;
        proxy_pass http://grafana;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # Static Files (Frontend)
    # ═══════════════════════════════════════════════════════════════════════════
    
    location / {
        root /app/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ═══════════════════════════════════════════════════════════════════════════
    # Error Pages
    # ═══════════════════════════════════════════════════════════════════════════
    
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

